services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: changeme
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: ./api
    image: ${REGISTRY:-local}/fil-rouge-api:1.0.0
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: tasks
      DB_USER: tasks
      POSTGRES_PASSWORD: changeme
      LOG_LEVEL: info
      APP_VERSION: 1.0.0
    read_only: true          # simule readOnlyRootFilesystem
    tmpfs: [/tmp]
    depends_on: [db]

  web:
    build: ./web
    image: ${REGISTRY:-local}/fil-rouge-web:1.0.0
    read_only: true
    tmpfs: [/tmp]

  # Remplace l'Ingress en local : / -> web, /api -> api
  ingress:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./local-ingress.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on: [web, api]

volumes:
  db-data:

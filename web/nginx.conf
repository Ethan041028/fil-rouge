# Remplace /etc/nginx/conf.d/default.conf de nginx-unprivileged.
# Les fichiers temporaires et le pid de cette image sont déjà dans /tmp,
# donc compatible readOnlyRootFilesystem (monter un emptyDir sur /tmp).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

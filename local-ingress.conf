# Uniquement pour docker compose : joue le rôle de l'Ingress Kubernetes.
#   /     -> web:8080
#   /api  -> api:8080
server {
    listen 8080;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
    }
}
